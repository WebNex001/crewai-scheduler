{% extends "base.html" %}

{% block title %}任务分类 - TaskFlow{% endblock %}

{% block header_title %}任务分类{% endblock %}

{% block content %}
<div class="toolbar">
    <button class="btn btn-primary" onclick="openCategoryModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        新建分类
    </button>
</div>

<!-- 分类列表 -->
<div id="categoryList" class="task-list">
    <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
        </svg>
        <h3>暂无分类</h3>
        <p>创建分类来管理您的任务</p>
    </div>
</div>

<!-- 创建分类模态框 -->
<div class="modal-overlay" id="categoryModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">新建分类</h3>
            <button class="modal-close" onclick="TaskFlow.Modal.hide('categoryModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <form id="categoryForm">
            <div class="modal-body">
                <input type="hidden" id="categoryId" name="id">
                <div class="form-group">
                    <label class="form-label">分类名称 *</label>
                    <input type="text" class="form-control" id="categoryName" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">颜色</label>
                    <input type="color" class="form-control" id="categoryColor" name="color" value="#3498db">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="TaskFlow.Modal.hide('categoryModal')">取消</button>
                <button type="submit" class="btn btn-primary">创建</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 加载分类列表
    async function loadCategories() {
        try {
            const data = await TaskFlow.API.get(`${TaskFlow.API_BASE_URL}/categories`);
            renderCategories(data.categories || []);
        } catch (error) {
            TaskFlow.Notification.error('加载分类失败');
        }
    }
    
    // 渲染分类列表
    function renderCategories(categories) {
        const container = document.getElementById('categoryList');
        if (!container) return;
        
        if (categories.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                    </svg>
                    <h3>暂无分类</h3>
                    <p>创建分类来管理您的任务</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = categories.map(cat => `
            <div class="task-item">
                <div class="task-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="task-category" style="background-color: ${cat.color}">${escapeHtml(cat.name)}</span>
                        <span style="color: var(--text-secondary)">${cat.task_count} 个任务</span>
                    </div>
                    <div class="task-actions" style="opacity: 1;">
                        <button class="btn btn-sm btn-icon" onclick="editCategory(${cat.id}, '${escapeHtml(cat.name)}', '${cat.color}')" title="编辑">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="btn btn-sm btn-icon" onclick="deleteCategory(${cat.id})" title="删除">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    // 创建/更新分类
    async function saveCategory(event) {
        event.preventDefault();
        
        const categoryId = document.getElementById('categoryId').value;
        const name = document.getElementById('categoryName').value.trim();
        const color = document.getElementById('categoryColor').value;
        
        if (!name) {
            TaskFlow.Notification.error('请填写分类名称');
            return;
        }
        
        try {
            if (categoryId) {
                await TaskFlow.API.put(`${TaskFlow.API_BASE_URL}/categories/${categoryId}`, { name, color });
                TaskFlow.Notification.success('分类更新成功');
            } else {
                await TaskFlow.API.post(`${TaskFlow.API_BASE_URL}/categories`, { name, color });
                TaskFlow.Notification.success('分类创建成功');
            }
            
            TaskFlow.Modal.hide('categoryModal');
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            loadCategories();
        } catch (error) {
            TaskFlow.Notification.error(error.message || '保存分类失败');
        }
    }
    
    function openCategoryModal() {
        document.getElementById('categoryForm').reset();
        document.getElementById('categoryId').value = '';
        document.getElementById('categoryColor').value = '#3498db';
        TaskFlow.Modal.show('categoryModal');
    }
    
    function editCategory(id, name, color) {
        document.getElementById('categoryId').value = id;
        document.getElementById('categoryName').value = name;
        document.getElementById('categoryColor').value = color;
        TaskFlow.Modal.show('categoryModal');
    }
    
    async function deleteCategory(id) {
        if (!confirm('确定要删除这个分类吗？')) return;
        
        try {
            await TaskFlow.API.delete(`${TaskFlow.API_BASE_URL}/categories/${id}`);
            TaskFlow.Notification.success('分类删除成功');
            loadCategories();
        } catch (error) {
            TaskFlow.Notification.error('删除分类失败');
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('categoryForm')?.addEventListener('submit', saveCategory);
        loadCategories();
    });
</script>
{% endblock %}
