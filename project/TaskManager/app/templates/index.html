{% extends "base.html" %}

{% block title %}TaskFlow - 我的任务{% endblock %}

{% block extra_css %}
<style>
    /* 页面特定样式 */
    .text-danger { color: var(--danger-color); }
</style>
{% endblock %}

{% block content %}
<!-- 统计卡片 -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label">总任务数</div>
        <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">待处理</div>
        <div class="stat-value pending" id="stat-pending">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">进行中</div>
        <div class="stat-value in_progress" id="stat-in_progress">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">已完成</div>
        <div class="stat-value completed" id="stat-completed">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">已逾期</div>
        <div class="stat-value overdue" id="stat-overdue">0</div>
    </div>
</div>

<!-- 工具栏 -->
<div class="toolbar">
    <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="form-control" id="searchInput" placeholder="搜索任务...">
    </div>
    <div class="filters">
        <select class="filter-select" id="filterStatus">
            <option value="">全部状态</option>
            <option value="pending">待处理</option>
            <option value="in_progress">进行中</option>
            <option value="completed">已完成</option>
            <option value="cancelled">已取消</option>
        </select>
        <select class="filter-select" id="filterPriority">
            <option value="">全部优先级</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="urgent">紧急</option>
        </select>
        <select class="filter-select" id="filterCategory">
            <option value="">全部分类</option>
        </select>
    </div>
</div>

<!-- 任务列表 -->
<div id="taskList" class="task-list">
    <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <h3>暂无任务</h3>
        <p>点击上方"新建任务"按钮创建您的第一个任务</p>
    </div>
</div>

<!-- 分页 -->
<div id="pagination" class="pagination"></div>

<!-- 任务表单模态框 -->
<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="taskModalTitle">新建任务</h3>
            <button class="modal-close" onclick="TaskFlow.Modal.hide('taskModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <form id="taskForm">
            <div class="modal-body">
                <input type="hidden" id="taskId" name="id">
                
                <div class="form-group">
                    <label class="form-label">任务标题 *</label>
                    <input type="text" class="form-control" id="taskTitle" name="title" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">任务描述</label>
                    <textarea class="form-control" id="taskDescription" name="description" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">优先级</label>
                    <select class="form-control" id="taskPriority" name="priority">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                        <option value="urgent">紧急</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select class="form-control" id="taskStatus" name="status">
                        <option value="pending" selected>待处理</option>
                        <option value="in_progress">进行中</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">到期日</label>
                    <input type="datetime-local" class="form-control" id="taskDueDate" name="due_date">
                </div>
                
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select class="form-control" id="taskCategory" name="category_id">
                        <option value="">无分类</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="taskReminder" name="reminder">
                        <span>设置到期提醒</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="TaskFlow.Modal.hide('taskModal')">取消</button>
                <button type="submit" class="btn btn-primary" id="taskSubmitBtn">创建任务</button>
            </div>
        </form>
    </div>
</div>

<!-- 任务详情模态框 -->
<div class="modal-overlay" id="taskDetailModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">任务详情</h3>
            <button class="modal-close" onclick="TaskFlow.Modal.hide('taskDetailModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <h2 id="detailTitle" style="margin-bottom: 16px;"></h2>
            <p id="detailDescription" style="color: var(--text-secondary); margin-bottom: 16px;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <strong>优先级：</strong><span id="detailPriority"></span>
                </div>
                <div>
                    <strong>状态：</strong><span id="detailStatus"></span>
                </div>
                <div>
                    <strong>到期日：</strong><span id="detailDueDate"></span>
                </div>
                <div>
                    <strong>分类：</strong><span id="detailCategory"></span>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="TaskFlow.Modal.hide('taskDetailModal')">关闭</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
<script>
    // 打开新建任务模态框
    function openTaskModal() {
        document.getElementById('taskForm').reset();
        document.getElementById('taskId').value = '';
        document.getElementById('taskModalTitle').textContent = '新建任务';
        document.getElementById('taskSubmitBtn').textContent = '创建任务';
        TaskFlow.Modal.show('taskModal');
    }
    
    // 退出登录
    function handleLogout() {
        if (confirm('确定要退出登录吗？')) {
            window.location.href = '/logout';
        }
    }
</script>
{% endblock %}
