{% extends "base.html" %}

{% block title %}注册 - TaskFlow{% endblock %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                    <rect x="9" y="3" width="6" height="4" rx="1"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
                TaskFlow
            </h1>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">用户名 *</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名（3-80个字符）" minlength="3" maxlength="80">
            </div>
            
            <div class="form-group">
                <label class="form-label">邮箱 *</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="请输入邮箱地址">
            </div>
            
            <div class="form-group">
                <label class="form-label">真实姓名</label>
                <input type="text" class="form-control" id="fullName" name="full_name" placeholder="请输入真实姓名（可选）">
            </div>
            
            <div class="form-group">
                <label class="form-label">密码 *</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码（至少6位）" minlength="6">
            </div>
            
            <div class="form-group">
                <label class="form-label">确认密码 *</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required placeholder="请再次输入密码">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                注册
            </button>
        </form>
        
        <div class="auth-footer">
            已有账号？ <a href="/login">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
