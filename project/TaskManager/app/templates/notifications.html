{% extends "base.html" %}

{% block title %}通知中心 - TaskFlow{% endblock %}

{% block header_title %}通知中心{% endblock %}

{% block content %}
<!-- 通知列表 -->
<div id="notificationList" class="task-list">
    <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <h3>暂无通知</h3>
        <p>您的通知将在这里显示</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 加载通知列表
    async function loadNotifications() {
        try {
            const data = await TaskFlow.API.get(`${TaskFlow.API_BASE_URL}/notifications`);
            renderNotifications(data.notifications || []);
        } catch (error) {
            TaskFlow.Notification.error('加载通知失败');
        }
    }
    
    // 渲染通知列表
    function renderNotifications(notifications) {
        const container = document.getElementById('notificationList');
        if (!container) return;
        
        if (notifications.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                    </svg>
                    <h3>暂无通知</h3>
                    <p>您的通知将在这里显示</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = notifications.map(n => `
            <div class="task-item" style="opacity: ${n.is_read ? 0.6 : 1};">
                <div class="task-header">
                    <span class="task-title">${escapeHtml(n.title)}</span>
                    ${n.is_read ? '' : '<span class="badge">新</span>'}
                </div>
                ${n.content ? `<p style="color: var(--text-secondary); font-size: 13px;">${escapeHtml(n.content)}</p>` : ''}
                <div class="task-meta">
                    <span>${TaskFlow.DateUtils.relative(n.created_at)}</span>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    document.addEventListener('DOMContentLoaded', loadNotifications);
</script>
{% endblock %}
